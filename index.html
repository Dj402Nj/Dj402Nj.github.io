<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <title>مه‌دیار</title>
    <style>
        body {
            font-family: Tahoma;
            background: #667eea;
            padding: 20px;
            color: #fff;
            text-align: center;
        }
        .box {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
        }
        .btn {
            background: #ffd700;
            color: #333;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            margin: 3px;
        }
        .btn-danger {
            background: #ff1744;
            color: #fff;
        }
        input {
            width: 90%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            margin: 10px 0;
        }
        .task {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 10px;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task.done {
            text-decoration: line-through;
            opacity: 0.6;
        }
        .loan {
            border-right: 4px solid #ff5252;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 5px 0;
            text-align: right;
        }
        .loan.paid {
            border-right-color: #00e676;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #ccc;
            border-radius: 10px;
            margin: 5px 0;
        }
        .progress-fill {
            height: 100%;
            background: #ffd700;
            border-radius: 10px;
            transition: width 0.3s;
        }
        .tab-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }
        .tab-bar button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        .tab-bar button.active {
            background: #ffd700;
            color: #333;
        }
        .hidden {
            display: none;
        }
        .quote {
            font-style: italic;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .savings-item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="quote" id="quote">🌅 بارگذاری...</div>

        <div class="tab-bar">
            <button class="btn active" onclick="showTab('dashboard')">📊 خانه</button>
            <button class="btn" onclick="showTab('savings')">🏦 پس‌انداز</button>
            <button class="btn" onclick="showTab('loans')">💰 اقساط</button>
        </div>

        <div id="tab-dashboard">
            <div class="box">
                <h3>✅ کارهای امروز</h3>
                <div id="taskList"></div>
                <input type="text" id="newTaskInput" placeholder="کار جدید...">
                <button class="btn" onclick="addTask()">➕ افزودن</button>
                <button class="btn btn-danger" onclick="clearAllTasks()">🗑️ پاک کردن همه</button>
            </div>

            <div class="box">
                <h3>📊 آمار امروز</h3>
                <p>💰 هزینه: <span id="todayExpense">۰</span> ریال</p>
                <p>📌 تعداد: <span id="todayCount">۰</span></p>
            </div>
        </div>

        <div id="tab-savings" class="hidden">
            <div class="box">
                <h3>🏦 پس‌انداز</h3>
                <p>🎯 هدف: <span id="monthlyGoal">ثبت نشده</span></p>
                <p>💰 پس‌انداز: <span id="savedSoFar">۰</span> ریال</p>
                <p>⏳ باقیمانده: <span id="remainingSave">۰</span> ریال</p>
                <div class="progress-bar">
                    <div class="progress-fill" id="savingsProgress" style="width:0%;"></div>
                </div>
                <input type="number" id="saveAmount" placeholder="مبلغ پس‌انداز...">
                <button class="btn" onclick="addSavings()">➕ ثبت پس‌انداز</button>
                <button class="btn" onclick="setMonthlyGoal()">🎯 تنظیم هدف</button>
                <button class="btn btn-danger" onclick="clearAllSavings()">🗑️ پاک کردن همه</button>
                <div id="savingsHistory"></div>
            </div>
        </div>

        <div id="tab-loans" class="hidden">
            <div class="box">
                <h3>💰 اقساط</h3>
                <div id="loanList"></div>
                <input type="text" id="loanName" placeholder="نام قسط">
                <input type="number" id="loanTotal" placeholder="مبلغ کل">
                <input type="number" id="loanPaid" placeholder="پرداخت شده" value="0">
                <input type="text" id="loanDue" placeholder="تاریخ قسط بعدی (مثلاً ۱۴۰۵/۰۶/۰۵)">
                <button class="btn" onclick="addLoan()">➕ افزودن قسط</button>
                <button class="btn btn-danger" onclick="clearAllLoans()">🗑️ پاک کردن همه</button>
            </div>
        </div>
    </div>

    <script>
        // ====== دیتابیس ======
        let db;
        const DB_NAME = 'FinanceDB';

        function openDB() {
            return new Promise((resolve) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('tasks')) db.createObjectStore('tasks', { keyPath: 'id',
                            autoIncrement: true });
                    if (!db.objectStoreNames.contains('savings')) db.createObjectStore('savings', { keyPath: 'id',
                            autoIncrement: true });
                    if (!db.objectStoreNames.contains('loans')) db.createObjectStore('loans', { keyPath: 'id',
                            autoIncrement: true });
                    if (!db.objectStoreNames.contains('goals')) db.createObjectStore('goals', { keyPath: 'id',
                            autoIncrement: true });
                    if (!db.objectStoreNames.contains('transactions')) db.createObjectStore('transactions', { keyPath: 'id',
                            autoIncrement: true });
                };
                req.onsuccess = () => { db = req.result;
                    resolve(); };
            });
        }

        function addData(store, data) {
            return new Promise((resolve) => {
                const tx = db.transaction(store, 'readwrite');
                tx.objectStore(store).add(data).onsuccess = () => resolve();
            });
        }

        function getAllData(store) {
            return new Promise((resolve) => {
                const tx = db.transaction(store, 'readonly');
                tx.objectStore(store).getAll().onsuccess = (e) => resolve(e.target.result);
            });
        }

        function updateData(store, data) {
            return new Promise((resolve) => {
                const tx = db.transaction(store, 'readwrite');
                tx.objectStore(store).put(data).onsuccess = () => resolve();
            });
        }

        function deleteData(store, id) {
            return new Promise((resolve) => {
                const tx = db.transaction(store, 'readwrite');
                tx.objectStore(store).delete(id).onsuccess = () => resolve();
            });
        }

        function clearStore(store) {
            return new Promise((resolve) => {
                const tx = db.transaction(store, 'readwrite');
                tx.objectStore(store).clear().onsuccess = () => resolve();
            });
        }

        // ====== تاریخ شمسی ======
        function toPersianDate(date) {
            return new Intl.DateTimeFormat('fa-IR', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(
            date));
        }

        function getTodayPersian() {
            return toPersianDate(new Date());
        }

        // ====== تب‌ها ======
        function showTab(tab) {
            document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tab).classList.remove('hidden');
            document.querySelectorAll('.tab-bar .btn').forEach(el => el.classList.remove('active'));
            document.querySelector('.tab-bar .btn[onclick*="' + tab + '"]').classList.add('active');
            if (tab === 'savings') { loadSavings(); }
            if (tab === 'loans') loadLoans();
        }

        // ====== جمله انگیزشی ======
        async function fetchQuote() {
            try {
                const res = await fetch('https://api.quotable.io/random');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('quote').textContent = '🌅 "' + data.content + '" — ' + data.author;
                }
            } catch (e) {
                document.getElementById('quote').textContent = '🌅 "Believe you can and you\'re halfway there." — T. Roosevelt';
            }
        }
        fetchQuote();

        // ====== کارها ======
        async function loadTasks() {
            const tasks = await getAllData('tasks');
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            const today = getTodayPersian();
            const todayTasks = tasks.filter(t => t.date === today);
            if (todayTasks.length === 0) {
                list.innerHTML = '<p>✨ امروز کاری ثبت نشده</p>';
                return;
            }
            todayTasks.forEach(task => {
                const div = document.createElement('div');
                div.className = 'task' + (task.done ? ' done' : '');
                div.innerHTML = `
                        <span>${task.text}</span>
                        <div>
                            <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask(${task.id}, this.checked)">
                            <button onclick="deleteTask(${task.id})" style="background:red;border:none;color:#fff;border-radius:5px;padding:2px 8px;">✕</button>
                        </div>
                    `;
                list.appendChild(div);
            });
        }

        async function toggleTask(id, done) {
            const tasks = await getAllData('tasks');
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.done = done;
                await updateData('tasks', task);
                loadTasks();
            }
        }

        async function deleteTask(id) {
            if (confirm('حذف؟')) {
                await deleteData('tasks', id);
                loadTasks();
            }
        }

        async function addTask() {
            const input = document.getElementById('newTaskInput');
            const text = input.value.trim();
            if (!text) {
                alert('متن کار رو بنویس!');
                return;
            }
            await addData('tasks', { text, done: false, date: getTodayPersian() });
            input.value = '';
            loadTasks();
        }

        async function clearAllTasks() {
            if (confirm('همه کارهای امروز رو پاک کنم؟')) {
                const tasks = await getAllData('tasks');
                const today = getTodayPersian();
                const todayTasks = tasks.filter(t => t.date === today);
                for (const task of todayTasks) {
                    await deleteData('tasks', task.id);
                }
                loadTasks();
                alert('✅ همه کارهای امروز پاک شدن!');
            }
        }

        // ====== پس‌انداز ======
        async function loadSavings() {
            const savings = await getAllData('savings');
            const goals = await getAllData('goals');
            const now = new Date();
            const goal = goals.find(g => g.month === now.getMonth() && g.year === now.getFullYear());
            const monthlyGoal = goal ? goal.amount : 0;
            const thisMonth = savings.filter(s => {
                const d = new Date(s.date);
                return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            });
            const total = thisMonth.reduce((s, i) => s + i.amount, 0);

            document.getElementById('monthlyGoal').textContent = monthlyGoal > 0 ? monthlyGoal.toLocaleString() + ' ریال' :
                'ثبت نشده';
            document.getElementById('savedSoFar').textContent = total.toLocaleString();
            document.getElementById('remainingSave').textContent = Math.max(0, monthlyGoal - total).toLocaleString();
            document.getElementById('savingsProgress').style.width = monthlyGoal > 0 ? Math.min((total / monthlyGoal) *
                100, 100) + '%' : '0%';

            const history = document.getElementById('savingsHistory');
            history.innerHTML = '';
            if (thisMonth.length === 0) {
                history.innerHTML = '<p>⏳ هنوز پس‌اندازی ثبت نشده</p>';
            } else {
                thisMonth.slice(-5).reverse().forEach(s => {
                    const div = document.createElement('div');
                    div.className = 'savings-item';
                    div.innerHTML = `
                            <span>📅 ${toPersianDate(s.date)}</span>
                            <span>+${s.amount.toLocaleString()} ریال</span>
                        `;
                    history.appendChild(div);
                });
            }
        }

        async function addSavings() {
            const input = document.getElementById('saveAmount');
            const amount = parseInt(input.value);
            if (!amount || amount <= 0) {
                alert('مبلغ معتبر وارد کن!');
                return;
            }
            await addData('savings', { amount, date: new Date().toISOString() });
            input.value = '';
            loadSavings();
            alert('✅ پس‌انداز ثبت شد!');
        }

        async function setMonthlyGoal() {
            const amount = prompt('🎯 هدف پس‌انداز این ماه (ریال):');
            if (!amount) return;
            const num = parseInt(amount.replace(/,/g, ''));
            if (!num || num <= 0) {
                alert('عدد معتبر وارد کن!');
                return;
            }
            const now = new Date();
            const goals = await getAllData('goals');
            const existing = goals.find(g => g.month === now.getMonth() && g.year === now.getFullYear());
            if (existing) await deleteData('goals', existing.id);
            await addData('goals', { month: now.getMonth(), year: now.getFullYear(), amount: num });
            loadSavings();
            alert('✅ هدف ثبت شد!');
        }

        async function clearAllSavings() {
            if (confirm('همه پس‌اندازهای این ماه رو پاک کنم؟')) {
                const savings = await getAllData('savings');
                const now = new Date();
                const thisMonth = savings.filter(s => {
                    const d = new Date(s.date);
                    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                });
                for (const s of thisMonth) {
                    await deleteData('savings', s.id);
                }
                loadSavings();
                alert('✅ همه پس‌اندازهای این ماه پاک شدن!');
            }
        }

        // ====== اقساط ======
        async function loadLoans() {
            const loans = await getAllData('loans');
            const list = document.getElementById('loanList');
            list.innerHTML = '';
            if (loans.length === 0) {
                list.innerHTML = '<p>💳 هیچ قسطی ثبت نشده</p>';
                return;
            }
            loans.forEach(loan => {
                const rem = loan.total - loan.paid;
                const prog = loan.total > 0 ? (loan.paid / loan.total) * 100 : 0;
                const div = document.createElement('div');
                div.className = 'loan' + (rem === 0 ? ' paid' : '');
                div.innerHTML = `
                        <strong>${loan.name}</strong>
                        <div>کل: ${loan.total.toLocaleString()} | پرداخت: ${loan.paid.toLocaleString()} | باقی: ${rem.toLocaleString()}</div>
                        <div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div>
                        <div>📅 قسط بعدی: ${loan.nextDue || 'نامشخص'}</div>
                        <div style="margin-top:5px;">
                            <input type="number" id="payment_${loan.id}" placeholder="مبلغ" style="width:70%;">
                            <button class="btn" onclick="payLoan(${loan.id})" style="padding:5px 10px;font-size:14px;">💳 پرداخت</button>
                            <button onclick="deleteLoan(${loan.id})" style="background:red;border:none;color:#fff;border-radius:5px;padding:5px 10px;">🗑️</button>
                        </div>
                    `;
                list.appendChild(div);
            });
            checkLoanReminders(loans);
        }

        async function payLoan(id) {
            const input = document.getElementById('payment_' + id);
            const amount = parseInt(input.value);
            if (!amount || amount <= 0) {
                alert('مبلغ معتبر وارد کن!');
                return;
            }
            const loans = await getAllData('loans');
            const loan = loans.find(l => l.id === id);
            if (loan) {
                loan.paid += amount;
                if (loan.paid > loan.total) loan.paid = loan.total;
                await updateData('loans', loan);
                loadLoans();
                alert('✅ پرداخت ثبت شد!');
            }
        }

        async function deleteLoan(id) {
            if (confirm('حذف؟')) {
                await deleteData('loans', id);
                loadLoans();
            }
        }

        async function addLoan() {
            const name = document.getElementById('loanName').value.trim();
            const total = parseInt(document.getElementById('loanTotal').value);
            const paid = parseInt(document.getElementById('loanPaid').value) || 0;
            const nextDue = document.getElementById('loanDue').value.trim();
            if (!name || !total) {
                alert('نام و مبلغ کل رو وارد کن!');
                return;
            }
            await addData('loans', { name, total, paid, nextDue: nextDue || 'نامشخص', createdAt: new Date()
                    .toISOString() });
            document.getElementById('loanName').value = '';
            document.getElementById('loanTotal').value = '';
            document.getElementById('loanPaid').value = '0';
            document.getElementById('loanDue').value = '';
            loadLoans();
            alert('✅ قسط اضافه شد!');
        }

        async function clearAllLoans() {
            if (confirm('همه اقساط رو پاک کنم؟')) {
                await clearStore('loans');
                loadLoans();
                alert('✅ همه اقساط پاک شدن!');
            }
        }

        function checkLoanReminders(loans) {
            const today = new Date();
            loans.forEach(loan => {
                if (loan.nextDue && loan.nextDue !== 'نامشخص' && loan.paid < loan.total) {
                    const parts = loan.nextDue.split('/');
                    if (parts.length === 3) {
                        const due = new Date(parseInt(parts[0]) + 1300, parseInt(parts[1]) - 1, parseInt(parts[2]));
                        const diff = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
                        if (diff === 3) alert('⚠️ ۳ روز تا قسط ' + loan.name + ' مونده!');
                        if (diff === 0) alert('⚠️ امروز موعد قسط ' + loan.name + ' هست!');
                    }
                }
            });
        }

        // ====== آمار امروز ======
        async function updateTodayStats() {
            const transactions = await getAllData('transactions');
            const today = getTodayPersian();
            const todayTxs = transactions.filter(t => t.persianDate === today);
            const total = todayTxs.reduce((s, t) => s + t.amount, 0);
            document.getElementById('todayExpense').textContent = total.toLocaleString();
            document.getElementById('todayCount').textContent = todayTxs.length;
        }

        // ====== شروع ======
        async function init() {
            await openDB();
            loadTasks();
            loadSavings();
            loadLoans();
            updateTodayStats();
        }
        init();
        setInterval(updateTodayStats, 60000);
    </script>
</body>
</html>
