<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست مه‌دیار</title>
    <style>
        body {
            font-family: Tahoma;
            background: #f4f7fc;
            padding: 16px;
            color: #1e293b;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #e2e8f0;
        }
        .btn {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin: 4px;
            display: inline-block;
        }
        .btn-success {
            background: #10b981;
        }
        .btn-danger {
            background: #ef4444;
        }
        .btn-outline {
            background: #e2e8f0;
            color: #1e293b;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            margin: 4px 0;
            font-size: 14px;
        }
        .hidden {
            display: none;
        }
        .item-row {
            background: #f8fafc;
            padding: 8px 12px;
            border-radius: 10px;
            margin: 4px 0;
            display: flex;
            justify-content: space-between;
            border: 1px solid #e9edf2;
        }
        .tab-bar {
            display: flex;
            gap: 4px;
            background: #fff;
            padding: 6px;
            border-radius: 16px;
            margin-bottom: 16px;
            border: 1px solid #e2e8f0;
        }
        .tab-bar .btn {
            flex: 1;
            background: transparent;
            color: #64748b;
            border-radius: 12px;
            font-size: 12px;
            padding: 8px 4px;
        }
        .tab-bar .btn.active {
            background: #3b82f6;
            color: #fff;
        }
    </style>
</head>
<body>

    <div style="max-width:500px;margin:0 auto;">
        <h2 style="text-align:center;">🧪 تست مه‌دیار</h2>

        <div class="tab-bar">
            <button class="btn active" onclick="showTab('dashboard')">📊 خانه</button>
            <button class="btn" onclick="showTab('test')">🔧 تست</button>
        </div>

        <div id="tab-dashboard">
            <div class="card">
                <h3>💰 درآمد / خرج</h3>
                <input type="number" id="amountInput" placeholder="مبلغ">
                <input type="text" id="descInput" placeholder="توضیح">
                <button class="btn btn-success" onclick="testAddIncome()">➕ درآمد</button>
                <button class="btn btn-danger" onclick="testAddExpense()">➖ خرج</button>
                <div id="incomeExpenseContainer"></div>
            </div>

            <div class="card">
                <h3>✅ کارهای امروز</h3>
                <input type="text" id="newTaskInput" placeholder="کار جدید...">
                <button class="btn" onclick="testAddTask()">➕ افزودن کار</button>
                <div id="taskList"></div>
            </div>
        </div>

        <div id="tab-test" class="hidden">
            <div class="card">
                <h3>🔧 تست دکمه‌ها</h3>
                <button class="btn" onclick="alert('✅ دکمه کار می‌کند!')">کلیک کن</button>
                <button class="btn btn-success" onclick="alert('✅ دکمه سبز کار می‌کند!')">دکمه سبز</button>
                <button class="btn btn-danger" onclick="alert('✅ دکمه قرمز کار می‌کند!')">دکمه قرمز</button>
                <p style="margin-top:12px;color:#64748b;">اگه پیغام دیدی، یعنی دکمه‌ها سالم هستن و مشکل از چیز دیگه‌ایست.</p>
            </div>
        </div>
    </div>

    <script>
        // ========== دیتابیس ساده ==========
        let testData = {
            transactions: [],
            tasks: []
        };

        // ========== نمایش تب‌ها ==========
        function showTab(tab) {
            document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tab).classList.remove('hidden');
            document.querySelectorAll('.tab-bar .btn').forEach(el => el.classList.remove('active'));
            document.querySelector(`.tab-bar .btn[onclick*="${tab}"]`).classList.add('active');
            if (tab === 'dashboard') renderAll();
        }

        // ========== تست درآمد ==========
        function testAddIncome() {
            const amount = document.getElementById('amountInput').value;
            const desc = document.getElementById('descInput').value || 'درآمد';
            if (!amount || amount <= 0) { alert('مبلغ معتبر وارد کن!'); return; }
            testData.transactions.push({
                id: Date.now(),
                amount: parseInt(amount),
                description: desc,
                type: 'income',
                persianDate: new Date().toLocaleDateString('fa-IR')
            });
            document.getElementById('amountInput').value = '';
            document.getElementById('descInput').value = '';
            renderAll();
            alert('✅ درآمد ثبت شد!');
        }

        // ========== تست خرج ==========
        function testAddExpense() {
            const amount = document.getElementById('amountInput').value;
            const desc = document.getElementById('descInput').value || 'خرج';
            if (!amount || amount <= 0) { alert('مبلغ معتبر وارد کن!'); return; }
            testData.transactions.push({
                id: Date.now(),
                amount: parseInt(amount),
                description: desc,
                type: 'expense',
                persianDate: new Date().toLocaleDateString('fa-IR')
            });
            document.getElementById('amountInput').value = '';
            document.getElementById('descInput').value = '';
            renderAll();
            alert('✅ خرج ثبت شد!');
        }

        // ========== تست کار ==========
        function testAddTask() {
            const text = document.getElementById('newTaskInput').value.trim();
            if (!text) { alert('متن کار رو بنویس!'); return; }
            testData.tasks.push({
                id: Date.now(),
                text: text,
                done: false,
                date: new Date().toLocaleDateString('fa-IR')
            });
            document.getElementById('newTaskInput').value = '';
            renderAll();
            alert('✅ کار اضافه شد!');
        }

        // ========== حذف کار ==========
        function testDeleteTask(id) {
            if (!confirm('حذف کنم؟')) return;
            testData.tasks = testData.tasks.filter(t => t.id !== id);
            renderAll();
        }

        // ========== نمایش همه ==========
        function renderAll() {
            renderTransactions();
            renderTasks();
        }

        function renderTransactions() {
            const container = document.getElementById('incomeExpenseContainer');
            if (testData.transactions.length === 0) {
                container.innerHTML = '<p style="color:#94a3b8;">هیچ تراکنشی ثبت نشده</p>';
                return;
            }
            container.innerHTML = '';
            testData.transactions.slice().reverse().forEach(t => {
                const div = document.createElement('div');
                div.className = 'item-row';
                const label = t.type === 'income' ? '💰 درآمد' : '💸 خرج';
                div.innerHTML = `
                    <span>${label} - ${t.amount.toLocaleString()} ریال (${t.description})</span>
                    <button onclick="testDeleteTransaction(${t.id})" style="background:#fee2e2;border:none;border-radius:30px;padding:2px 12px;color:#dc2626;cursor:pointer;">🗑️</button>
                `;
                container.appendChild(div);
            });
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            if (testData.tasks.length === 0) {
                list.innerHTML = '<p style="color:#94a3b8;">✨ کاری ثبت نشده</p>';
                return;
            }
            list.innerHTML = '';
            testData.tasks.forEach(task => {
                const div = document.createElement('div');
                div.className = 'item-row';
                div.innerHTML = `
                    <span>${task.done ? '✅' : '⬜'} ${task.text}</span>
                    <button onclick="testDeleteTask(${task.id})" style="background:#fee2e2;border:none;border-radius:30px;padding:2px 12px;color:#dc2626;cursor:pointer;">🗑️</button>
                `;
                list.appendChild(div);
            });
        }

        // ========== حذف تراکنش ==========
        function testDeleteTransaction(id) {
            if (!confirm('حذف کنم؟')) return;
            testData.transactions = testData.transactions.filter(t => t.id !== id);
            renderAll();
        }

        // ========== شروع ==========
        renderAll();
    </script>

</body>
                    </html>
