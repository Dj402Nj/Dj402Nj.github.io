<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="/manifest.json">
    <title>Mehdiar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .box {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .box h3 {
            margin-bottom: 10px;
            color: #ffd700;
            font-weight: 600;
        }
        .btn {
            background: #ffd700;
            color: #333;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin: 3px;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        .btn-danger {
            background: #ff1744;
            color: #fff;
        }
        .btn-success {
            background: #00c853;
            color: #fff;
        }
        .btn-family {
            background: #e040fb;
            color: #fff;
        }
        .btn-rent {
            background: #ff9100;
            color: #fff;
        }
        .btn-income {
            background: #00bcd4;
            color: #fff;
        }
        input,
        select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            margin: 8px 0;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }
        input:focus {
            outline: 2px solid #ffd700;
        }
        .task-item,
        .savings-item,
        .loan-item,
        .family-item,
        .rent-item,
        .income-item {
            background: rgba(255, 255, 255, 0.12);
            padding: 10px 12px;
            border-radius: 10px;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .task-item.done {
            text-decoration: line-through;
            opacity: 0.5;
        }
        .task-item .task-text {
            flex: 1;
            text-align: left;
        }
        .loan-item {
            display: block;
            border-right: 4px solid #ff5252;
        }
        .loan-item.paid {
            border-right-color: #00e676;
        }
        .loan-detail {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            width: 100%;
            font-size: 13px;
            opacity: 0.9;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin: 5px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff6b6b);
            border-radius: 10px;
            transition: width 0.5s;
        }
        .progress-fill.green {
            background: linear-gradient(90deg, #00c853, #00e676);
        }
        .tab-bar {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .tab-bar button {
            flex: 1;
            padding: 10px 5px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
            min-width: 45px;
        }
        .tab-bar button.active {
            background: #ffd700;
            color: #333;
        }
        .tab-bar button:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .hidden {
            display: none !important;
        }
        .quote {
            font-style: italic;
            background: rgba(255, 255, 255, 0.15);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
            border-right: 3px solid #ffd700;
        }
        .delete-btn {
            background: #ff1744;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 3px 12px;
            cursor: pointer;
            font-size: 12px;
        }
        .delete-btn:hover {
            opacity: 0.8;
        }
        .report-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .report-total {
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 2px solid #ffd700;
        }
        .balance-box {
            background: rgba(255, 215, 0, 0.15);
            padding: 18px;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 2px solid #ffd700;
            text-align: center;
        }
        .balance-box .big-number {
            font-size: 32px;
            font-weight: bold;
            margin: 8px 0;
        }
        .balance-box .positive {
            color: #00e676;
        }
        .balance-box .negative {
            color: #ff5252;
        }
        .balance-box .sub-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
            font-size: 14px;
        }
        .family-item .member-name {
            font-weight: bold;
            color: #e040fb;
        }
        .rent-item .rent-status {
            font-size: 12px;
            opacity: 0.8;
        }
        .loan-actions {
            display: flex;
            gap: 5px;
            margin-top: 5px;
            flex-wrap: wrap;
            width: 100%;
        }
        .loan-actions input {
            flex: 2;
            min-width: 80px;
        }
        .loan-actions .btn {
            flex: 1;
            min-width: 60px;
            padding: 6px 10px;
            font-size: 12px;
        }
        .savings-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .badge {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
        }
        .badge.paid {
            background: #00c853;
        }
        .badge.unpaid {
            background: #ff5252;
        }
        .inline-flex {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .mt-10 {
            margin-top: 10px;
        }
        .w-100 {
            width: 100%;
        }
        @media (max-width: 480px) {
            .tab-bar button {
                font-size: 9px;
                padding: 8px 3px;
            }
            .balance-box .big-number {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Quote -->
        <div class="quote" id="quote">🌅 Loading...</div>

        <!-- Tabs -->
        <div class="tab-bar">
            <button class="active" onclick="showTab('dashboard')">📊 Home</button>
            <button onclick="showTab('reports')">📈 Reports</button>
            <button onclick="showTab('savings')">🏦 Savings</button>
            <button onclick="showTab('loans')">💰 Loans</button>
            <button onclick="showTab('family')">👨‍👩‍👧‍👧 Family</button>
            <button onclick="showTab('rent')">🏠 Rent</button>
            <button onclick="showTab('income')">💵 Income</button>
        </div>

        <!-- ====== DASHBOARD ====== -->
        <div id="tab-dashboard">
            <div class="balance-box" id="balanceBox">
                <h3>💰 Balance</h3>
                <div class="big-number" id="balanceDisplay">0 Rials</div>
                <div class="sub-stats">
                    <span>📈 Income: <span id="totalIncomeDisplay" style="color:#00e676;">0</span></span>
                    <span>📉 Expense: <span id="totalExpenseDisplay" style="color:#ff5252;">0</span></span>
                </div>
            </div>

            <div class="box">
                <h3>✅ Today's Tasks</h3>
                <div id="taskList"></div>
                <input type="text" id="newTaskInput" placeholder="New task...">
                <button class="btn" onclick="addTask()">➕ Add</button>
            </div>

            <div class="box">
                <h3>📊 Today's Stats</h3>
                <p>💰 Today's Expense: <span id="todayExpense">0</span> Rials</p>
                <p>📌 Transactions: <span id="todayCount">0</span></p>
            </div>
        </div>

        <!-- ====== REPORTS ====== -->
        <div id="tab-reports" class="hidden">
            <div class="box">
                <h3>📈 Financial Reports</h3>
                <div class="inline-flex" style="margin-bottom:10px;">
                    <button class="btn" onclick="showReport('monthly')">📅 Monthly</button>
                    <button class="btn" onclick="showReport('yearly')">📅 Yearly</button>
                </div>
                <div id="reportContent">
                    <p style="opacity:0.7;">Select an option</p>
                </div>
            </div>
        </div>

        <!-- ====== SAVINGS ====== -->
        <div id="tab-savings" class="hidden">
            <div class="box">
                <h3>🏦 Savings</h3>
                <p>🎯 Goal: <span id="monthlyGoal">Not set</span></p>
                <p>💰 Saved: <span id="savedSoFar">0</span> Rials</p>
                <p>⏳ Remaining: <span id="remainingSave">0</span> Rials</p>
                <div class="progress-bar">
                    <div class="progress-fill green" id="savingsProgress" style="width:0%;"></div>
                </div>
                <input type="number" id="saveAmount" placeholder="Amount...">
                <button class="btn" onclick="addSavings()">➕ Add</button>
                <button class="btn" onclick="setMonthlyGoal()">🎯 Set Goal</button>
                <div id="savingsHistory" class="mt-10"></div>
            </div>
        </div>

        <!-- ====== LOANS ====== -->
        <div id="tab-loans" class="hidden">
            <div class="box">
                <h3>💰 Loans</h3>
                <div id="loanList"></div>
                <input type="text" id="loanName" placeholder="Loan name">
                <input type="number" id="loanTotal" placeholder="Total amount">
                <input type="number" id="loanPaid" placeholder="Paid" value="0">
                <input type="text" id="loanDue" placeholder="Next due (e.g. 1405/06/05)">
                <button class="btn" onclick="addLoan()">➕ Add Loan</button>
            </div>
        </div>

        <!-- ====== FAMILY ====== -->
        <div id="tab-family" class="hidden">
            <div class="box">
                <h3>👨‍👩‍👧‍👧 Family Expenses</h3>
                <div id="familyList"></div>
                <div class="inline-flex w-100">
                    <select id="familyMember" style="flex:1;">
                        <option value="Faezeh">Faezeh</option>
                        <option value="Delvan">Delvan</option>
                        <option value="Nilan">Nilan</option>
                        <option value="Other">Other</option>
                    </select>
                    <input type="text" id="familyOtherName" placeholder="Name (if Other)" style="flex:1;">
                </div>
                <input type="number" id="familyAmount" placeholder="Amount...">
                <input type="text" id="familyDesc" placeholder="Description...">
                <button class="btn btn-family" onclick="addFamilyExpense()">➕ Add Family Expense</button>
            </div>
        </div>

        <!-- ====== RENT ====== -->
        <div id="tab-rent" class="hidden">
            <div class="box">
                <h3>🏠 Rent</h3>
                <div id="rentList"></div>
                <input type="number" id="rentAmount" placeholder="Monthly rent amount">
                <input type="text" id="rentDue" placeholder="Next due date (e.g. 1405/06/05)">
                <button class="btn btn-rent" onclick="addRent()">➕ Add Rent</button>
            </div>
        </div>

        <!-- ====== INCOME ====== -->
        <div id="tab-income" class="hidden">
            <div class="box">
                <h3>💵 Income</h3>
                <div id="incomeList"></div>
                <input type="number" id="incomeAmount" placeholder="Income amount...">
                <input type="text" id="incomeSource" placeholder="Source (e.g. Salary, Freelance)">
                <button class="btn btn-income" onclick="addIncome()">➕ Add Income</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        //  DATABASE
        // ============================================================
        let db;
        const DB_NAME = 'MehdiarDB';

        function openDB() {
            return new Promise((resolve) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains('tasks')) db.createObjectStore('tasks', { keyPath: 'id',
                            autoIncrement: true });
                    if (!db.objectStoreNames.contains('savings')) db.createObjectStore('savings', { keyPath: 'id',
                            autoIncrement: true });
                    if (!db.objectStoreNames.contains('loans')) db.createObjectStore('loans', { keyPath: 'id',
                            autoIncrement: true });
                    if (!db.objectStoreNames.contains('goals')) db.createObjectStore('goals', { keyPath: 'id',
                            autoIncrement: true });
                    if (!db.objectStoreNames.contains('transactions')) db.createObjectStore('transactions', { keyPath: 'id',
                            autoIncrement: true });
                    if (!db.objectStoreNames.contains('family')) db.createObjectStore('family', { keyPath: 'id',
                            autoIncrement: true });
                    if (!db.objectStoreNames.contains('rent')) db.createObjectStore('rent', { keyPath: 'id',
                            autoIncrement: true });
                    if (!db.objectStoreNames.contains('income')) db.createObjectStore('income', { keyPath: 'id',
                            autoIncrement: true });
                };
                req.onsuccess = () => { db = req.result;
                    resolve(); };
            });
        }

        function addData(store, data) {
            return new Promise((resolve) => {
                const tx = db.transaction(store, 'readwrite');
                tx.objectStore(store).add(data).onsuccess = () => resolve();
            });
        }

        function getAllData(store) {
            return new Promise((resolve) => {
                const tx = db.transaction(store, 'readonly');
                tx.objectStore(store).getAll().onsuccess = (e) => resolve(e.target.result);
            });
        }

        function updateData(store, data) {
            return new Promise((resolve) => {
                const tx = db.transaction(store, 'readwrite');
                tx.objectStore(store).put(data).onsuccess = () => resolve();
            });
        }

        function deleteData(store, id) {
            return new Promise((resolve) => {
                const tx = db.transaction(store, 'readwrite');
                tx.objectStore(store).delete(id).onsuccess = () => resolve();
            });
        }

        function clearStore(store) {
            return new Promise((resolve) => {
                const tx = db.transaction(store, 'readwrite');
                tx.objectStore(store).clear().onsuccess = () => resolve();
            });
        }

        // ============================================================
        //  HELPER FUNCTIONS
        // ============================================================
        function toPersianDate(date) {
            return new Intl.DateTimeFormat('fa-IR', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(
            date));
        }

        function getTodayPersian() {
            return toPersianDate(new Date());
        }

        function getCurrentMonth() { return getTodayPersian().slice(0, 7); }

        function getCurrentYear() { return getTodayPersian().slice(0, 4); }

        function formatNumber(n) {
            return n ? n.toLocaleString() : '0';
        }

        // ============================================================
        //  TABS
        // ============================================================
        function showTab(tab) {
            document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tab).classList.remove('hidden');
            document.querySelectorAll('.tab-bar button').forEach(el => el.classList.remove('active'));
            document.querySelector(`.tab-bar button[onclick*="${tab}"]`).classList.add('active');
            if (tab === 'savings') loadSavings();
            if (tab === 'loans') loadLoans();
            if (tab === 'family') loadFamily();
            if (tab === 'rent') loadRent();
            if (tab === 'income') loadIncome();
            if (tab === 'reports') showReport('monthly');
            if (tab === 'dashboard') updateDashboard();
        }

        // ============================================================
        //  QUOTE
        // ============================================================
        async function fetchQuote() {
            try {
                const res = await fetch('https://api.quotable.io/random');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('quote').textContent = '🌅 "' + data.content + '" — ' + data.author;
                }
            } catch (e) {
                document.getElementById('quote').textContent = '🌅 "Believe you can and you\'re halfway there." — T. Roosevelt';
            }
        }
        fetchQuote();

        // ============================================================
        //  TASKS
        // ============================================================
        async function loadTasks() {
            const tasks = await getAllData('tasks');
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            const today = getTodayPersian();
            const todayTasks = tasks.filter(t => t.date === today);
            if (todayTasks.length === 0) {
                list.innerHTML = '<p style="opacity:0.7;">✨ No tasks for today</p>';
                return;
            }
            todayTasks.forEach(task => {
                const div = document.createElement('div');
                div.className = 'task-item' + (task.done ? ' done' : '');
                div.innerHTML = `
                    <span class="task-text">${task.text}</span>
                    <div>
                        <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask(${task.id}, this.checked)">
                        <button class="delete-btn" onclick="deleteTask(${task.id})">✕</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        async function toggleTask(id, done) {
            const tasks = await getAllData('tasks');
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.done = done;
                await updateData('tasks', task);
                loadTasks();
            }
        }

        async function deleteTask(id) {
            if (confirm('Delete this task?')) {
                await deleteData('tasks', id);
                loadTasks();
            }
        }

        async function addTask() {
            const input = document.getElementById('newTaskInput');
            const text = input.value.trim();
            if (!text) {
                alert('Please enter a task!');
                return;
            }
            await addData('tasks', { text, done: false, date: getTodayPersian() });
            input.value = '';
            loadTasks();
        }

        // ============================================================
        //  SAVINGS
        // ============================================================
        async function loadSavings() {
            const savings = await getAllData('savings');
            const goals = await getAllData('goals');
            const now = new Date();
            const goal = goals.find(g => g.month === now.getMonth() && g.year === now.getFullYear());
            const monthlyGoal = goal ? goal.amount : 0;
            const thisMonth = savings.filter(s => {
                const d = new Date(s.date);
                return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            });
            const total = thisMonth.reduce((s, i) => s + i.amount, 0);

            document.getElementById('monthlyGoal').textContent = monthlyGoal > 0 ? formatNumber(monthlyGoal) + ' Rials' :
                'Not set';
            document.getElementById('savedSoFar').textContent = formatNumber(total) + ' Rials';
            document.getElementById('remainingSave').textContent = formatNumber(Math.max(0, monthlyGoal - total)) +
            ' Rials';
            document.getElementById('savingsProgress').style.width = monthlyGoal > 0 ? Math.min((total / monthlyGoal) *
                100, 100) + '%' : '0%';

            const history = document.getElementById('savingsHistory');
            history.innerHTML = '';
            if (thisMonth.length === 0) {
                history.innerHTML = '<p style="opacity:0.7;">⏳ No savings recorded</p>';
            } else {
                thisMonth.slice().reverse().forEach(s => {
                    const div = document.createElement('div');
                    div.className = 'savings-item';
                    div.innerHTML = `
                        <span>📅 ${toPersianDate(s.date)}</span>
                        <span>+${formatNumber(s.amount)} Rials</span>
                        <button class="delete-btn" onclick="deleteSavings(${s.id})">✕</button>
                    `;
                    history.appendChild(div);
                });
            }
            updateDashboard();
        }

        async function deleteSavings(id) {
            if (confirm('Delete this savings?')) {
                await deleteData('savings', id);
                loadSavings();
            }
        }

        async function addSavings() {
            const input = document.getElementById('saveAmount');
            const amount = parseInt(input.value);
            if (!amount || amount <= 0) {
                alert('Enter a valid amount!');
                return;
            }
            await addData('savings', { amount, date: new Date().toISOString() });
            input.value = '';
            loadSavings();
            alert('✅ Savings added!');
        }

        async function setMonthlyGoal() {
            const amount = prompt('🎯 Enter this month\'s savings goal (Rials):');
            if (!amount) return;
            const num = parseInt(amount.replace(/,/g, ''));
            if (!num || num <= 0) {
                alert('Enter a valid number!');
                return;
            }
            const now = new Date();
            const goals = await getAllData('goals');
            const existing = goals.find(g => g.month === now.getMonth() && g.year === now.getFullYear());
            if (existing) await deleteData('goals', existing.id);
            await addData('goals', { month: now.getMonth(), year: now.getFullYear(), amount: num });
            loadSavings();
            alert('✅ Goal set!');
        }

        // ============================================================
        //  LOANS
        // ============================================================
        async function loadLoans() {
            const loans = await getAllData('loans');
            const list = document.getElementById('loanList');
            list.innerHTML = '';
            if (loans.length === 0) {
                list.innerHTML = '<p style="opacity:0.7;">💳 No loans recorded</p>';
                return;
            }
            loans.forEach(loan => {
                const rem = loan.total - loan.paid;
                const prog = loan.total > 0 ? (loan.paid / loan.total) * 100 : 0;
                const div = document.createElement('div');
                div.className = 'loan-item' + (rem === 0 ? ' paid' : '');
                div.innerHTML = `
                    <div style="display:flex;justify-content:space-between;width:100%;flex-wrap:wrap;">
                        <strong>${loan.name}</strong>
                        <button class="delete-btn" onclick="deleteLoan(${loan.id})">🗑️</button>
                    </div>
                    <div class="loan-detail">
                        <span>Total: ${formatNumber(loan.total)}</span>
                        <span>Paid: ${formatNumber(loan.paid)}</span>
                        <span>Remaining: <strong style="color:${rem === 0 ? '#00e676' : '#ff5252'}">${formatNumber(rem)}</strong></span>
                    </div>
                    <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(prog,100)}%"></div></div>
                    <div style="font-size:12px;opacity:0.8;">📅 Next due: ${loan.nextDue || 'Not set'}</div>
                    <div class="loan-actions">
                        <input type="number" id="payment_${loan.id}" placeholder="Payment amount">
                        <button class="btn" onclick="payLoan(${loan.id})" style="padding:5px 10px;font-size:12px;">💳 Pay</button>
                    </div>
                `;
                list.appendChild(div);
            });
            checkLoanReminders(loans);
            updateDashboard();
        }

        async function payLoan(id) {
            const input = document.getElementById('payment_' + id);
            const amount = parseInt(input.value);
            if (!amount || amount <= 0) {
                alert('Enter a valid amount!');
                return;
            }
            const loans = await getAllData('loans');
            const loan = loans.find(l => l.id === id);
            if (loan) {
                loan.paid += amount;
                if (loan.paid > loan.total) loan.paid = loan.total;
                await updateData('loans', loan);
                loadLoans();
                alert('✅ Payment recorded!');
            }
        }

        async function deleteLoan(id) {
            if (confirm('Delete this loan?')) {
                await deleteData('loans', id);
                loadLoans();
            }
        }

        async function addLoan() {
            const name = document.getElementById('loanName').value.trim();
            const total = parseInt(document.getElementById('loanTotal').value);
            const paid = parseInt(document.getElementById('loanPaid').value) || 0;
            const nextDue = document.getElementById('loanDue').value.trim();
            if (!name || !total) {
                alert('Enter loan name and total amount!');
                return;
            }
            await addData('loans', { name, total, paid, nextDue: nextDue || 'Not set', createdAt: new Date()
                    .toISOString() });
            document.getElementById('loanName').value = '';
            document.getElementById('loanTotal').value = '';
            document.getElementById('loanPaid').value = '0';
            document.getElementById('loanDue').value = '';
            loadLoans();
            alert('✅ Loan added!');
        }

        function checkLoanReminders(loans) {
            const today = new Date();
            loans.forEach(loan => {
                if (loan.nextDue && loan.nextDue !== 'Not set' && loan.paid < loan.total) {
                    const parts = loan.nextDue.split('/');
                    if (parts.length === 3) {
                        const due = new Date(parseInt(parts[0]) + 1300, parseInt(parts[1]) - 1, parseInt(parts[2]));
                        const diff = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
                        if (diff === 3) alert('⚠️ 3 days until ' + loan.name + ' payment is due!');
                        if (diff === 0) alert('⚠️ ' + loan.name + ' payment is due today!');
                    }
                }
            });
        }

        // ============================================================
        //  FAMILY
        // ============================================================
        async function loadFamily() {
            const items = await getAllData('family');
            const list = document.getElementById('familyList');
            list.innerHTML = '';
            if (items.length === 0) {
                list.innerHTML = '<p style="opacity:0.7;">👨‍👩‍👧‍👧 No family expenses recorded</p>';
                return;
            }
            items.slice().reverse().forEach(item => {
                const div = document.createElement('div');
                div.className = 'family-item';
                div.innerHTML = `
                    <div>
                        <span class="member-name">${item.member}</span>
                        <span style="opacity:0.8;"> - ${item.description || ''}</span>
                        <span style="font-size:12px;opacity:0.6;"> ${toPersianDate(item.date)}</span>
                    </div>
                    <div>
                        <span style="font-weight:bold;">${formatNumber(item.amount)} Rials</span>
                        <button class="delete-btn" onclick="deleteFamily(${item.id})">✕</button>
                    </div>
                `;
                list.appendChild(div);
            });
            updateDashboard();
        }

        async function deleteFamily(id) {
            if (confirm('Delete this expense?')) {
                await deleteData('family', id);
                loadFamily();
            }
        }

        async function addFamilyExpense() {
            const member = document.getElementById('familyMember').value;
            const otherName = document.getElementById('familyOtherName').value.trim();
            const finalMember = member === 'Other' ? (otherName || 'Other') : member;
            const amount = parseInt(document.getElementById('familyAmount').value);
            const desc = document.getElementById('familyDesc').value.trim();
            if (!amount || amount <= 0) {
                alert('Enter a valid amount!');
                return;
            }
            await addData('family', {
                member: finalMember,
                amount,
                description: desc || '',
                date: new Date().toISOString()
            });
            document.getElementById('familyAmount').value = '';
            document.getElementById('familyDesc').value = '';
            document.getElementById('familyOtherName').value = '';
            loadFamily();
            alert('✅ Family expense added!');
        }

        // ============================================================
        //  RENT
        // ============================================================
        async function loadRent() {
            const rents = await getAllData('rent');
            const list = document.getElementById('rentList');
            list.innerHTML = '';
            if (rents.length === 0) {
                list.innerHTML = '<p style="opacity:0.7;">🏠 No rent records</p>';
                return;
            }
            rents.slice().reverse().forEach(rent => {
                const isPaid = rent.paid || false;
                const div = document.createElement('div');
                div.className = 'rent-item';
                div.innerHTML = `
                    <div>
                        <strong>🏠 Monthly Rent</strong>
                        <span class="rent-status">📅 ${rent.dueDate || 'Not set'}</span>
                    </div>
                    <div>
                        <span style="font-weight:bold;">${formatNumber(rent.amount)} Rials</span>
                        <span class="badge ${isPaid ? 'paid' : 'unpaid'}">${isPaid ? '✅ Paid' : '❌ Unpaid'}</span>
                        <button class="delete-btn" onclick="deleteRent(${rent.id})">✕</button>
                    </div>
                    ${!isPaid ? `<button class="btn btn-success" onclick="payRent(${rent.id})" style="width:100%;margin-top:5px;">✅ Mark as Paid</button>` : ''}
                `;
                list.appendChild(div);
            });
            checkRentReminders(rents);
            updateDashboard();
        }

        async function payRent(id) {
            if (confirm('Mark this rent as paid?')) {
                const rents = await getAllData('rent');
                const rent = rents.find(r => r.id === id);
                if (rent) {
                    rent.paid = true;
                    await updateData('rent', rent);
                    loadRent();
                    alert('✅ Rent marked as paid!');
                }
            }
        }

        async function deleteRent(id) {
            if (confirm('Delete this rent record?')) {
                await deleteData('rent', id);
                loadRent();
            }
        }

        async function addRent() {
            const amount = parseInt(document.getElementById('rentAmount').value);
            const dueDate = document.getElementById('rentDue').value.trim();
            if (!amount || amount <= 0) {
                alert('Enter a valid rent amount!');
                return;
            }
            await addData('rent', { amount, dueDate: dueDate || 'Not set', paid: false, date: new Date().toISOString() });
            document.getElementById('rentAmount').value = '';
            document.getElementById('rentDue').value = '';
            loadRent();
            alert('✅ Rent record added!');
        }

        function checkRentReminders(rents) {
            const today = new Date();
            rents.forEach(rent => {
                if (rent.dueDate && rent.dueDate !== 'Not set' && !rent.paid) {
                    const parts = rent.dueDate.split('/');
                    if (parts.length === 3) {
                        const due = new Date(parseInt(parts[0]) + 1300, parseInt(parts[1]) - 1, parseInt(parts[2]));
                        const diff = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
                        if (diff === 3) alert('⚠️ 3 days until rent is due!');
                        if (diff === 0) alert('⚠️ Rent is due today!');
                    }
                }
            });
        }

        // ============================================================
        //  INCOME
        // ============================================================
        async function loadIncome() {
            const incomes = await getAllData('income');
            const list = document.getElementById('incomeList');
            list.innerHTML = '';
            if (incomes.length === 0) {
                list.innerHTML = '<p style="opacity:0.7;">💵 No income recorded</p>';
                return;
            }
            incomes.slice().reverse().forEach(inc => {
                const div = document.createElement('div');
                div.className = 'income-item';
                div.innerHTML = `
                    <div>
                        <strong>${inc.source || 'Income'}</strong>
                        <span style="font-size:12px;opacity:0.6;"> ${toPersianDate(inc.date)}</span>
                    </div>
                    <div>
                        <span style="font-weight:bold;color:#00e676;">+${formatNumber(inc.amount)} Rials</span>
                        <button class="delete-btn" onclick="deleteIncome(${inc.id})">✕</button>
                    </div>
                `;
                list.appendChild(div);
            });
            updateDashboard();
        }

        async function deleteIncome(id) {
            if (confirm('Delete this income?')) {
                await deleteData('income', id);
                loadIncome();
            }
        }

        async function addIncome() {
            const amount = parseInt(document.getElementById('incomeAmount').value);
            const source = document.getElementById('incomeSource').value.trim();
            if (!amount || amount <= 0) {
                alert('Enter a valid income amount!');
                return;
            }
            await addData('income', { amount, source: source || 'General', date: new Date().toISOString() });
            document.getElementById('incomeAmount').value = '';
            document.getElementById('incomeSource').value = '';
            loadIncome();
            alert('✅ Income added!');
        }

        // ============================================================
        //  DASHBOARD / BALANCE
        // ============================================================
        async function updateDashboard() {
            const transactions = await getAllData('transactions');
            const incomes = await getAllData('income');
            const family = await getAllData('family');
            const rent = await getAllData('rent');

            // Total income
            const totalIncome = incomes.reduce((s, i) => s + i.amount, 0);

            // Total expenses: transactions + family + rent (only unpaid)
            const totalTx = transactions.reduce((s, t) => s + t.amount, 0);
            const totalFamily = family.reduce((s, f) => s + f.amount, 0);
            const totalRent = rent.filter(r => !r.paid).reduce((s, r) => s + r.amount, 0);
            const totalExpense = totalTx + totalFamily + totalRent;

            const balance = totalIncome - totalExpense;

            document.getElementById('totalIncomeDisplay').textContent = formatNumber(totalIncome);
            document.getElementById('totalExpenseDisplay').textContent = formatNumber(totalExpense);

            const balanceDisplay = document.getElementById('balanceDisplay');
            balanceDisplay.textContent = formatNumber(balance) + ' Rials';
            balanceDisplay.className = 'big-number ' + (balance >= 0 ? 'positive' : 'negative');

            // Today's stats
            const today = getTodayPersian();
            const todayTxs = transactions.filter(t => t.persianDate === today);
            const todayTotal = todayTxs.reduce((s, t) => s + t.amount, 0);
            document.getElementById('todayExpense').textContent = formatNumber(todayTotal);
            document.getElementById('todayCount').textContent = todayTxs.length;
        }

        // ============================================================
        //  REPORTS
        // ============================================================
        async function showReport(type) {
            const transactions = await getAllData('transactions');
            const savings = await getAllData('savings');
            const family = await getAllData('family');
            const incomes = await getAllData('income');
            const content = document.getElementById('reportContent');

            let filtered = [];
            let title = '';
            if (type === 'monthly') {
                const month = getCurrentMonth();
                filtered = transactions.filter(t => t.persianDate && t.persianDate.startsWith(month));
                title = '📅 Monthly Report - ' + month;
            } else if (type === 'yearly') {
                const year = getCurrentYear();
                filtered = transactions.filter(t => t.persianDate && t.persianDate.startsWith(year));
                title = '📅 Yearly Report - ' + year;
            }

            const total = filtered.reduce((s, t) => s + t.amount, 0);

            // Category breakdown
            const cats = {};
            filtered.forEach(t => { cats[t.category] = (cats[t.category] || 0) + t.amount; });

            let html = `<h4 style="margin-bottom:10px;">${title}</h4>`;

            if (filtered.length === 0) {
                html += '<p style="opacity:0.7;">No expenses recorded</p>';
            } else {
                html += `<div style="margin-bottom:10px;">`;
                for (const [cat, amt] of Object.entries(cats)) {
                    const pct = Math.round((amt / total) * 100);
                    html += `
                            <div class="report-item">
                                <span>${cat}</span>
                                <span>${formatNumber(amt)} Rials (${pct}%)</span>
                            </div>
                        `;
                }
                html += `</div>`;
                html += `<div class="report-total">💰 Total Expense: ${formatNumber(total)} Rials</div>`;
                html += `<div style="margin-top:5px;font-size:13px;opacity:0.7;">📌 ${filtered.length} transactions</div>`;
            }

            // Family expenses
            const now = new Date();
            const monthFamily = family.filter(f => {
                const d = new Date(f.date);
                if (type === 'monthly') return d.getMonth() === now.getMonth() && d.getFullYear() === now
                .getFullYear();
                else return d.getFullYear() === now.getFullYear();
            });
            const totalFamily = monthFamily.reduce((s, f) => s + f.amount, 0);
            if (totalFamily > 0) {
                html += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.2);">
                            <p>👨‍👩‍👧‍👧 Family Expenses: <strong>${formatNumber(totalFamily)}</strong> Rials</p>
                        </div>`;
            }

            // Income
            const monthIncome = incomes.filter(i => {
                const d = new Date(i.date);
                if (type === 'monthly') return d.getMonth() === now.getMonth() && d.getFullYear() === now
                .getFullYear();
                else return d.getFullYear() === now.getFullYear();
            });
            const totalIncome = monthIncome.reduce((s, i) => s + i.amount, 0);
            if (totalIncome > 0) {
                html += `<div style="margin-top:5px;">
                            <p>💵 Income: <strong style="color:#00e676;">${formatNumber(totalIncome)}</strong> Rials</p>
                        </div>`;
            }

            // Savings
            const monthSavings = savings.filter(s => {
                const d = new Date(s.date);
                if (type === 'monthly') return d.getMonth() === now.getMonth() && d.getFullYear() === now
                .getFullYear();
                else return d.getFullYear() === now.getFullYear();
            });
            const totalSave = monthSavings.reduce((s, i) => s + i.amount, 0);
            if (totalSave > 0) {
                html += `<div style="margin-top:5px;">
                            <p>🏦 Savings: <strong style="color:#ffd700;">${formatNumber(totalSave)}</strong> Rials</p>
                        </div>`;
            }

            // Balance
            const balance = totalIncome - (total + totalFamily);
            html += `<div style="margin-top:15px;padding-top:15px;border-top:2px solid #ffd700;">
                        <p style="font-size:18px;font-weight:bold;">💰 Balance: <span style="color:${balance >= 0 ? '#00e676' : '#ff5252'};">${formatNumber(balance)}</span> Rials</p>
                    </div>`;

            content.innerHTML = html;
        }

        // ============================================================
        //  INIT
        // ============================================================
        async function init() {
            await openDB();
            loadTasks();
            loadSavings();
            loadLoans();
            loadFamily();
            loadRent();
            loadIncome();
            updateDashboard();
            // Auto-refresh every 5 minutes
            setInterval(updateDashboard, 300000);
            // Quote refresh every hour
            setInterval(fetchQuote, 3600000);
        }
        init();
    </script>
